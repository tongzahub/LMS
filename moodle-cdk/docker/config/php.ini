; =============================================================================
; PHP Configuration for Moodle LMS on AWS ECS Fargate
; OPcache tuned for production performance
; No hardcoded credentials — all config via environment variables
; =============================================================================

[PHP]
; General settings
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
max_input_vars = 5000
post_max_size = 128M
upload_max_filesize = 128M
date.timezone = UTC
display_errors = Off
log_errors = On
error_log = /dev/stderr

[opcache]
; Enable OPcache
opcache.enable = 1
opcache.enable_cli = 1

; Memory consumption: configurable via OPCACHE_MEMORY_CONSUMPTION env var
; Default 512 MB, valid range 256-512 MB per design spec
opcache.memory_consumption = ${OPCACHE_MEMORY_CONSUMPTION:-512}

; Interned strings buffer
opcache.interned_strings_buffer = 64

; Maximum number of accelerated files (high value for Moodle's large codebase)
opcache.max_accelerated_files = 20000

; Revalidation frequency: 0 = check on every request (dev), 60+ for production
opcache.revalidate_freq = 60

; Don't check timestamps in production (faster, requires restart on deploy)
opcache.validate_timestamps = 0

; Save comments (required by Moodle for annotations)
opcache.save_comments = 1

; Enable file cache for faster restarts
opcache.file_cache = /var/www/moodle/local/opcache

; JIT compilation (PHP 8.x)
opcache.jit = 1255
opcache.jit_buffer_size = 128M

[session]
; Sessions handled by Redis/ElastiCache — configured in Moodle config.php
; These are fallback defaults only
session.save_handler = files
session.save_path = /tmp
session.gc_maxlifetime = 7200
